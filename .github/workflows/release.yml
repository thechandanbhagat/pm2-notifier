name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify and publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  NODE_VERSION: '22.23.3'
  NPM_VERSION: '11.12.1'

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      archive: ${{ steps.pack.outputs.archive }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'A stable release tag in the format v1.2.3 is required.' >&2
            exit 1
          fi

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify release metadata
        id: metadata
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { name, version } = require('./package.json');
          if (name !== '@thechandanbhagat/pm2-notifier') throw new Error('Unexpected npm package name');
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Release tag must match package.json version');
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${commit}\n`);
          NODE

      - name: Install pinned npm and dependencies
        run: |
          npm install --global "npm@$NPM_VERSION"
          npm ci

      - name: Check types
        run: npm run check

      - name: Audit production dependencies
        run: |
          if npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json"; then
            audit_status=0
          else
            audit_status=$?
          fi
          if (( audit_status > 1 )); then
            cat "$RUNNER_TEMP/npm-audit.json" >&2
            exit 1
          fi
          node <<'NODE'
          const report = require(process.env.RUNNER_TEMP + '/npm-audit.json');
          if (report.error || report.auditReportVersion !== 2 || !report.vulnerabilities || typeof report.vulnerabilities !== 'object' || Array.isArray(report.vulnerabilities)) {
            throw new Error('npm audit did not return a valid vulnerability report');
          }
          const allowedUrl = 'https://github.com/advisories/GHSA-vfj7-8cjw-p6xm';
          function isKnownAdvisory(name, ancestors = new Set()) {
            const vulnerability = report.vulnerabilities[name];
            if (ancestors.has(name) || !vulnerability || !Array.isArray(vulnerability.via) || vulnerability.via.length === 0) return false;
            const visited = new Set([...ancestors, name]);
            return vulnerability.via.every(advisory => typeof advisory === 'string'
              ? isKnownAdvisory(advisory, visited)
              : advisory && advisory.name === 'braces' && advisory.url === allowedUrl);
          }
          for (const name of Object.keys(report.vulnerabilities)) {
            if (!isKnownAdvisory(name)) throw new Error(`Unapproved npm advisory affects ${name}`);
          }
          NODE

      - name: Run unit tests
        run: npm test

      - name: Test PM2 module installation on Linux
        run: npm run test:integration

      - name: Pack release artifact
        id: pack
        run: |
          mkdir -p excluded
          npm pack --pack-destination excluded --json > "$RUNNER_TEMP/npm-pack.json"
          archive=$(node -e "const p = require(process.env.RUNNER_TEMP + '/npm-pack.json'); if (p.length !== 1 || !/^[a-z0-9.-]+\.tgz$/.test(p[0].filename)) throw new Error('Unexpected npm archive'); process.stdout.write(p[0].filename)")
          cd excluded
          sha256sum "$archive" > "$archive.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          cp ../CHANGELOG.md release-notes.md
          printf '\n## Install\n\n```sh\npm2 install @thechandanbhagat/pm2-notifier\n```\n' >> release-notes.md

      - name: Upload verified artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pm2-notifier-${{ steps.metadata.outputs.version }}
          path: |
            excluded/*.tgz
            excluded/*.sha256
            excluded/release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish npm and GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
      ARCHIVE: ${{ needs.verify.outputs.archive }}
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check source has not moved
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Set up npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"

      - name: Download verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pm2-notifier-${{ needs.verify.outputs.version }}
          path: excluded

      - name: Verify archive checksum and metadata
        working-directory: excluded
        run: |
          sha256sum --check "$ARCHIVE.sha256"
          tar -xOf "$ARCHIVE" package/package.json > "$RUNNER_TEMP/release-package.json"
          node <<'NODE'
          const { name, version } = require(process.env.RUNNER_TEMP + '/release-package.json');
          if (name !== '@thechandanbhagat/pm2-notifier' || version !== process.env.PACKAGE_VERSION) {
            throw new Error('Release artifact does not match verified package metadata');
          }
          NODE

      - name: Publish exact archive to npm
        working-directory: excluded
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          expected_integrity=$(node -e "const fs = require('node:fs'); const crypto = require('node:crypto'); process.stdout.write('sha512-' + crypto.createHash('sha512').update(fs.readFileSync(process.env.ARCHIVE)).digest('base64'))")
          package_spec="@thechandanbhagat/pm2-notifier@$PACKAGE_VERSION"
          if npm view "$package_spec" dist.integrity --json > "$RUNNER_TEMP/npm-view.json" 2> "$RUNNER_TEMP/npm-view.err"; then
            if [[ "$(jq -er 'select(type == "string")' "$RUNNER_TEMP/npm-view.json")" != "$expected_integrity" ]]; then
              echo "$package_spec is already published with a different archive; existing npm and GitHub assets will not be changed." >&2
              exit 1
            fi
            echo "$package_spec already contains this exact archive."
          else
            if ! jq -e '.error.code == "E404"' "$RUNNER_TEMP/npm-view.json" > /dev/null; then
              cat "$RUNNER_TEMP/npm-view.err" >&2
              cat "$RUNNER_TEMP/npm-view.json" >&2
              exit 1
            fi
            provenance=(--provenance=false)
            if [[ "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" && "$GITHUB_SHA" = "$RELEASE_COMMIT" ]]; then
              provenance=(--provenance)
            else
              echo '::notice::Publishing without provenance because this dispatch ref differs from the release source. Run the workflow from the release tag to include provenance.'
            fi
            npm publish "$ARCHIVE" --access public --ignore-scripts "${provenance[@]}"
            npm view "$package_spec" dist.integrity --json > "$RUNNER_TEMP/npm-view.json"
            if [[ "$(jq -er 'select(type == "string")' "$RUNNER_TEMP/npm-view.json")" != "$expected_integrity" ]]; then
              echo "Registry integrity for $package_spec does not match the published archive; GitHub release publication is blocked." >&2
              exit 1
            fi
          fi

      - name: Publish GitHub release with verified archive
        working-directory: excluded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/github-releases.json"
          release_count=$(jq -r --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length' "$RUNNER_TEMP/github-releases.json")
          if [[ "$release_count" = 1 ]]; then
            jq --arg tag "$RELEASE_TAG" '.[][] | select(.tag_name == $tag)' "$RUNNER_TEMP/github-releases.json" > "$RUNNER_TEMP/github-release.json"
            missing_assets=()
            for asset in "$ARCHIVE" "$ARCHIVE.sha256"; do
              asset_count=$(jq -r --arg name "$asset" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/github-release.json")
              if [[ "$asset_count" = 0 ]]; then
                missing_assets+=("$asset")
              elif [[ "$asset_count" = 1 ]]; then
                expected_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
                if ! actual_digest=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest | select(type == "string")' "$RUNNER_TEMP/github-release.json"); then
                  echo "GitHub release asset $asset has no verifiable digest; existing release assets will not be changed." >&2
                  exit 1
                fi
                if [[ "$actual_digest" != "$expected_digest" ]]; then
                  echo "GitHub release asset $asset differs from the verified archive; existing release assets will not be changed." >&2
                  exit 1
                fi
              else
                echo "Unexpected duplicate GitHub release asset: $asset" >&2
                exit 1
              fi
            done
            if (( ${#missing_assets[@]} > 0 )); then
              gh release upload "$RELEASE_TAG" "${missing_assets[@]}"
            fi
            if jq -e '.draft == true' "$RUNNER_TEMP/github-release.json" > /dev/null; then
              gh release edit "$RELEASE_TAG" --draft=false --latest
            fi
          elif [[ "$release_count" = 0 ]]; then
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          else
            echo "Unexpected duplicate GitHub release for $RELEASE_TAG" >&2
            exit 1
          fi
